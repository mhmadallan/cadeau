<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadeau Store</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <main class="mx-auto max-w-6xl px-4 py-8">
    <header class="mb-8 flex flex-col gap-2 md:flex-row md:items-end md:justify-between">
      <div>
        <h1 class="text-3xl font-bold">Cadeau Online Store</h1>
        <p class="text-slate-600">Browse available products.</p>
      </div>
      <div class="flex gap-3">
        <a href="/admin.html" class="rounded-lg bg-white px-4 py-2 text-slate-900 ring-1 ring-slate-300 hover:bg-slate-50">Admin</a>
        <button id="refreshBtn" class="rounded-lg bg-slate-900 px-4 py-2 text-white hover:bg-slate-700">Refresh Products</button>
      </div>
    </header>

    <section>
      <h2 class="mb-4 text-xl font-semibold">Products</h2>
      <p id="message" class="mb-4 text-sm text-slate-600"></p>
      <div id="productsGrid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
