<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Product - Cadeau Admin</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <main class="mx-auto max-w-3xl px-4 py-8">
    <header class="mb-8 flex items-center justify-between gap-3">
      <div>
        <h1 class="text-3xl font-bold">Edit Product</h1>
        <p class="text-slate-600">Admin access required.</p>
      </div>
      <a href="/admin.html" class="rounded-lg bg-white px-4 py-2 text-slate-900 ring-1 ring-slate-300 hover:bg-slate-50">Back to Admin</a>
    </header>

    <section class="rounded-xl bg-white p-5 shadow-sm">
      <form id="productForm" class="grid gap-4 md:grid-cols-2">
        <label class="flex flex-col gap-1">
          <span class="text-sm font-medium">Name *</span>
          <input id="name" class="rounded-lg border border-slate-300 px-3 py-2" required />
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-sm font-medium">Price *</span>
          <input id="price" type="number" step="0.01" min="0" class="rounded-lg border border-slate-300 px-3 py-2" required />
        </label>
        <label class="flex flex-col gap-1 md:col-span-2">
          <span class="text-sm font-medium">Description</span>
          <textarea id="description" rows="3" class="rounded-lg border border-slate-300 px-3 py-2"></textarea>
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-sm font-medium">Image URL</span>
          <input id="image_url" type="url" class="rounded-lg border border-slate-300 px-3 py-2" />
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-sm font-medium">Stock</span>
          <input id="stock" type="number" step="1" min="0" value="0" class="rounded-lg border border-slate-300 px-3 py-2" />
        </label>
        <div class="md:col-span-2 flex gap-3">
          <button class="rounded-lg bg-slate-900 px-4 py-2 text-white hover:bg-slate-700" type="submit">Update Product</button>
          <a href="/admin.html" class="rounded-lg bg-slate-200 px-4 py-2 font-medium text-slate-800 hover:bg-slate-300">Cancel</a>
        </div>
      </form>
      <p id="message" class="mt-4 text-sm"></p>
    </section>
  </main>

  <script src="/edit-product.js"></script>
</body>
</html>
