<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Cadeau</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <nav class="sticky top-0 z-20 border-b border-slate-200 bg-white">
    <div class="mx-auto max-w-6xl px-4 py-3 md:px-5">
      <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
        <div>
          <a href="./index.html" class="text-xl font-extrabold tracking-tight text-slate-950">Cadeau</a>
          <p class="text-xs uppercase tracking-[0.14em] text-slate-500">Access your account from anywhere.</p>
        </div>
        <div class="flex flex-wrap items-center gap-2 md:justify-end">
          <span id="navUser" class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-slate-600">Guest</span>
          <a href="./index.html" class="rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-900 transition hover:-translate-y-0.5 hover:bg-slate-50">Store</a>
          <a id="adminLink" href="./admin.html" class="rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-900 transition hover:-translate-y-0.5 hover:bg-slate-50" hidden>Admin</a>
          <a id="signinLink" href="./signin.html" aria-current="page" class="rounded-full bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-slate-800">Login</a>
          <a id="signupLink" href="./signup.html" class="rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-900 transition hover:-translate-y-0.5 hover:bg-slate-50">Sign Up</a>
          <button id="logoutBtn" type="button" class="rounded-full bg-slate-200 px-4 py-2 text-sm font-semibold text-slate-800 transition hover:-translate-y-0.5 hover:bg-slate-300" hidden>Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="mx-auto max-w-xl px-4 py-10">
    <header class="mb-8 flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold">Sign In</h1>
        <p class="text-slate-600">Access your Cadeau account.</p>
      </div>
      <a href="./index.html" class="rounded-lg bg-white px-4 py-2 text-slate-900 ring-1 ring-slate-300 hover:bg-slate-50">Back Home</a>
    </header>

    <section class="rounded-xl bg-white p-6 shadow-sm">
      <form id="signinForm" class="space-y-4">
        <label class="block">
          <span class="mb-1 block text-sm font-medium">Email</span>
          <input id="email" type="email" required class="w-full rounded-lg border border-slate-300 px-3 py-2" />
        </label>
        <label class="block">
          <span class="mb-1 block text-sm font-medium">Password</span>
          <input id="password" type="password" required class="w-full rounded-lg border border-slate-300 px-3 py-2" />
        </label>
        <button type="submit" class="w-full rounded-lg bg-emerald-600 px-4 py-2 text-white hover:bg-emerald-500">Sign In</button>
      </form>

      <p class="mt-4 text-sm text-slate-600">
        Don't have an account?
        <a href="./signup.html" class="font-medium text-emerald-700 hover:text-emerald-600">Create account</a>
      </p>

      <p id="message" class="mt-3 text-sm"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="var s=document.createElement('script');s.src='https://unpkg.com/@supabase/supabase-js@2';document.head.appendChild(s);"></script>
  <script src="./config.js?v=20260319d"></script>
  <script src="./auth.js?v=20260319d"></script>
  <script src="./signin.js?v=20260319d"></script>
</body>
</html>
