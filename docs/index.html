<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadeau Store</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <nav class="sticky top-0 z-20 border-b border-slate-200 bg-white">
    <div class="mx-auto max-w-6xl px-4 py-3 md:px-5">
      <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
        <div>
          <a href="./index.html" class="text-xl font-extrabold tracking-tight text-slate-950">Cadeau</a>
          <p class="text-xs uppercase tracking-[0.14em] text-slate-500">Thoughtful gifts, ready to browse.</p>
        </div>
        <div class="flex flex-wrap items-center gap-2 md:justify-end">
          <span id="navUser" class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-slate-600">Guest</span>
          <a href="./index.html" aria-current="page" class="rounded-full bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-slate-800">Store</a>
          <a id="adminLink" href="./admin.html" class="rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-900 transition hover:-translate-y-0.5 hover:bg-slate-50" hidden>Admin</a>
          <a id="signinLink" href="./signin.html" class="rounded-full bg-emerald-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-emerald-500">Login</a>
          <a id="signupLink" href="./signup.html" class="rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-900 transition hover:-translate-y-0.5 hover:bg-slate-50">Sign Up</a>
          <button id="logoutBtn" type="button" class="rounded-full bg-slate-200 px-4 py-2 text-sm font-semibold text-slate-800 transition hover:-translate-y-0.5 hover:bg-slate-300" hidden>Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="mx-auto max-w-6xl px-4 py-8">
    <header class="mb-8 flex flex-col gap-2 md:flex-row md:items-end md:justify-between">
      <div>
        <h1 class="text-3xl font-bold">Cadeau Online Store</h1>
        <p class="text-slate-600">Browse available products.</p>
      </div>
      <div class="flex gap-3">
        <button id="refreshBtn" class="rounded-lg bg-slate-900 px-4 py-2 text-white hover:bg-slate-700">Refresh Products</button>
      </div>
    </header>

    <section>
      <h2 class="mb-4 text-xl font-semibold">Products</h2>
      <p id="authMessage" class="mb-2 text-sm text-slate-600"></p>
      <p id="message" class="mb-4 text-sm text-slate-600"></p>
      <div id="productsGrid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js?v=20260322a"></script>
  <script src="./auth.js?v=20260322a"></script>
  <script src="./app.js?v=20260322a"></script>
  <script>
    (function () {
      function hasRenderedProducts() {
        var productsGrid = document.getElementById('productsGrid');
        return !!(productsGrid && productsGrid.children && productsGrid.children.length);
      }

      function setFallbackMessage(text, isError) {
        var message = document.getElementById('message');
        if (!message) return;
        message.textContent = text;
        message.className = 'mb-4 text-sm ' + (isError ? 'text-red-600' : 'text-slate-600');
      }

      function renderCards(products) {
        var productsGrid = document.getElementById('productsGrid');
        if (!productsGrid) return;

        productsGrid.innerHTML = '';

        if (!products || !products.length) {
          productsGrid.innerHTML = '<p class="text-slate-600">No products available yet.</p>';
          return;
        }

        for (var i = 0; i < products.length; i += 1) {
          var product = products[i] || {};
          var card = document.createElement('article');
          card.className = 'overflow-hidden rounded-xl bg-white shadow-sm ring-1 ring-slate-200';

          var description = product.description != null ? product.description : '';
          var stock = product.stock != null ? product.stock : 0;
          var image = product.image_url
            ? '<img src="' + product.image_url + '" alt="' + (product.name || 'Product') + '" class="h-44 w-full object-cover" />'
            : '<div class="grid h-44 place-items-center bg-slate-200 text-slate-500">No image</div>';

          card.innerHTML =
            image +
            '<div class="p-4">' +
            '<h3 class="text-lg font-semibold">' + (product.name || 'Unnamed product') + '</h3>' +
            '<p class="mt-1 text-sm text-slate-600 min-h-10">' + description + '</p>' +
            '<div class="mt-3 flex items-center justify-between text-sm">' +
            '<span class="font-medium text-emerald-700">$' + Number(product.price || 0).toFixed(2) + '</span>' +
            '<span class="rounded-full bg-slate-100 px-2 py-1 text-slate-700">Stock: ' + stock + '</span>' +
            '</div>' +
            '</div>';

          productsGrid.appendChild(card);
        }
      }

      function runFallbackFetch() {
        if (hasRenderedProducts()) {
          return;
        }

        var appConfig = window.APP_CONFIG || {};
        var apiBase = (appConfig.API_BASE_URL || '').replace(/\/+$/, '');

        if (!apiBase) {
          setFallbackMessage('Fallback: missing API_BASE_URL in config.js', true);
          return;
        }

        var apiUrl = apiBase + '/api/products';
        var started = Date.now();
        setFallbackMessage('Fallback: loading products... API: ' + apiUrl, false);

        fetch(apiUrl)
          .then(function (response) {
            return response.json().then(function (products) {
              var elapsedMs = Date.now() - started;
              if (!response.ok) {
                var errorMessage = products && products.error ? products.error : ('HTTP ' + response.status);
                setFallbackMessage('Fallback failed after ' + elapsedMs + 'ms: ' + errorMessage + '. API: ' + apiUrl, true);
                return;
              }

              renderCards(products);
              setFallbackMessage('Fallback loaded ' + (products ? products.length : 0) + ' product(s) in ' + elapsedMs + 'ms. API: ' + apiUrl, false);
            });
          })
          .catch(function (error) {
            setFallbackMessage('Fallback network error: ' + error.message + '. API: ' + apiUrl, true);
          });
      }

      setTimeout(runFallbackFetch, 2200);

      function refreshAuthDisplay() {
        var appConfig = window.APP_CONFIG || {};
        var apiBase = (appConfig.API_BASE_URL || '').replace(/\/+$/, '');
        var supabaseUrl = appConfig.SUPABASE_URL;

        if (!apiBase || !supabaseUrl) {
          return;
        }

        var sessionKey = 'sb_' + supabaseUrl.split('.')[0].split('//')[1].split('-')[0] + '_auth_token';
        var storedSession = null;

        try {
          storedSession = localStorage.getItem(sessionKey) || localStorage.getItem('sb-auth-token');
        } catch (_e) {}

        if (storedSession) {
          try {
            var parsed = JSON.parse(storedSession);
            var token = parsed.access_token || parsed.token || '';

            if (token) {
              fetch(apiBase + '/api/me', {
                headers: { Authorization: 'Bearer ' + token },
              })
                .then(function (r) {
                  return r.json().catch(function () {
                    return {};
                  });
                })
                .then(function (data) {
                  if (data && data.email) {
                    var navUser = document.getElementById('navUser');
                    if (navUser) {
                      navUser.textContent = data.email + ' (' + (data.role || 'user') + ')';
                    }
                  }
                });
            }
          } catch (_e) {}
        }
      }

      setTimeout(refreshAuthDisplay, 1000);
    })();
  </script>
</body>
</html>
