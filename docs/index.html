<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadeau Store</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <nav class="sticky top-0 z-20 border-b border-slate-200 bg-white">
    <div class="mx-auto max-w-6xl px-4 py-3 md:px-5">
      <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
        <div>
          <a href="./index.html" class="text-xl font-extrabold tracking-tight text-slate-950">Cadeau</a>
          <p class="text-xs uppercase tracking-[0.14em] text-slate-500">Thoughtful gifts, ready to browse.</p>
        </div>
        <div class="flex flex-wrap items-center gap-2 md:justify-end">
          <span id="navUser" class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-slate-600">Guest</span>
          <a href="./index.html" aria-current="page" class="rounded-full bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-slate-800">Store</a>
          <a id="adminLink" href="./admin.html" class="rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-900 transition hover:-translate-y-0.5 hover:bg-slate-50" hidden>Admin</a>
          <a id="signinLink" href="./signin.html" class="rounded-full bg-emerald-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-emerald-500">Login</a>
          <a id="signupLink" href="./signup.html" class="rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-900 transition hover:-translate-y-0.5 hover:bg-slate-50">Sign Up</a>
          <button id="logoutBtn" type="button" class="rounded-full bg-slate-200 px-4 py-2 text-sm font-semibold text-slate-800 transition hover:-translate-y-0.5 hover:bg-slate-300" hidden>Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="mx-auto max-w-6xl px-4 py-8">
    <header class="mb-8 flex flex-col gap-2 md:flex-row md:items-end md:justify-between">
      <div>
        <h1 class="text-3xl font-bold">Cadeau Online Store</h1>
        <p class="text-slate-600">Browse available products.</p>
      </div>
      <div class="flex gap-3">
        <button id="refreshBtn" class="rounded-lg bg-slate-900 px-4 py-2 text-white hover:bg-slate-700">Refresh Products</button>
      </div>
    </header>

    <section>
      <h2 class="mb-4 text-xl font-semibold">Products</h2>
      <p id="authMessage" class="mb-2 text-sm text-slate-600"></p>
      <p id="message" class="mb-4 text-sm text-slate-600"></p>
      <div id="productsGrid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js?v=20260321c"></script>
  <script src="./auth.js?v=20260321c"></script>
  <script src="./app.js?v=20260321c"></script>
</body>
</html>
