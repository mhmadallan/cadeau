<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadeau Store</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <nav class="border-b border-slate-200 bg-white/90 backdrop-blur-sm">
    <div class="mx-auto flex max-w-6xl flex-col gap-4 px-4 py-4 md:flex-row md:items-center md:justify-between">
      <div>
        <a href="./index.html" class="text-xl font-bold tracking-tight text-slate-950">Cadeau</a>
        <p class="text-sm text-slate-500">Thoughtful gifts, ready to browse.</p>
      </div>
      <div class="flex flex-wrap items-center gap-2 md:justify-end">
        <span id="navUser" class="mr-2 text-sm text-slate-500">Guest</span>
        <a href="./index.html" aria-current="page" class="rounded-full bg-slate-900 px-4 py-2 text-sm font-medium text-white">Store</a>
        <a id="adminLink" href="./admin.html" class="rounded-full bg-white px-4 py-2 text-sm font-medium text-slate-900 ring-1 ring-slate-300 hover:bg-slate-50" hidden>Admin</a>
        <a id="signinLink" href="./signin.html" class="rounded-full bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-500">Login</a>
        <a id="signupLink" href="./signup.html" class="rounded-full bg-white px-4 py-2 text-sm font-medium text-slate-900 ring-1 ring-slate-300 hover:bg-slate-50">Sign Up</a>
        <button id="logoutBtn" type="button" class="rounded-full bg-slate-200 px-4 py-2 text-sm font-medium text-slate-800 hover:bg-slate-300" hidden>Logout</button>
      </div>
    </div>
  </nav>

  <main class="mx-auto max-w-6xl px-4 py-8">
    <header class="mb-8 flex flex-col gap-2 md:flex-row md:items-end md:justify-between">
      <div>
        <h1 class="text-3xl font-bold">Cadeau Online Store</h1>
        <p class="text-slate-600">Browse available products.</p>
      </div>
      <div class="flex gap-3">
        <button id="refreshBtn" class="rounded-lg bg-slate-900 px-4 py-2 text-white hover:bg-slate-700">Refresh Products</button>
      </div>
    </header>

    <section>
      <h2 class="mb-4 text-xl font-semibold">Products</h2>
      <p id="authMessage" class="mb-2 text-sm text-slate-600"></p>
      <p id="message" class="mb-4 text-sm text-slate-600"></p>
      <div id="productsGrid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./auth.js"></script>
  <script src="./app.js"></script>
</body>
</html>
