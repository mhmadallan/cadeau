<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadeau Admin</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <p id="accessMessage" role="status" class="p-4">Checking your sign-in...</p>
  <main id="protectedContent" class="mx-auto max-w-6xl px-4 py-8" hidden>
    <header class="mb-8 flex flex-col gap-2 md:flex-row md:items-end md:justify-between">
      <div>
        <h1 class="text-3xl font-bold">Admin Panel</h1>
        <p class="text-slate-600">Add, edit, and delete products.</p>
      </div>
      <div class="flex gap-2">
        <a href="./index.html" class="rounded-lg bg-white px-4 py-2 text-slate-900 ring-1 ring-slate-300 hover:bg-slate-50">Back to Store</a>
        <button id="logoutBtn" class="rounded-lg bg-slate-200 px-4 py-2 text-sm font-medium text-slate-800 hover:bg-slate-300" type="button">Logout</button>
      </div>
    </header>

    <section class="mb-8 rounded-xl bg-white p-5 shadow-sm">
      <h2 class="mb-2 text-xl font-semibold">Access Status</h2>
      <p id="authMessage" class="text-sm text-slate-600">Checking your account...</p>
    </section>

    <section id="manageSection" class="mb-8 rounded-xl bg-white p-5 shadow-sm" hidden>
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-xl font-semibold">Add Product</h2>
      </div>
      <form id="productForm" class="grid gap-4 md:grid-cols-2">
        <label class="flex flex-col gap-1">
          <span class="text-sm font-medium">Name *</span>
          <input id="name" class="rounded-lg border border-slate-300 px-3 py-2" required />
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-sm font-medium">Price *</span>
          <input id="price" type="number" step="0.01" min="0" class="rounded-lg border border-slate-300 px-3 py-2" required />
        </label>
        <label class="flex flex-col gap-1 md:col-span-2">
          <span class="text-sm font-medium">Description</span>
          <textarea id="description" rows="3" class="rounded-lg border border-slate-300 px-3 py-2"></textarea>
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-sm font-medium">Cover image URL</span>
          <input id="image_url" type="url" class="rounded-lg border border-slate-300 px-3 py-2" />
        </label>
        <label class="flex flex-col gap-1 md:col-span-2">
          <span class="text-sm font-medium">Upload cover image from device</span>
          <input id="coverFiles" type="file" accept="image/jpeg,image/png" />
        </label>
        <label class="flex flex-col gap-1 md:col-span-2">
          <span class="text-sm font-medium">Upload additional images from device</span>
          <input id="galleryFiles" type="file" accept="image/jpeg,image/png" multiple />
          <span class="text-sm text-slate-600">JPEG or PNG, up to 5 MB per image. You can also paste URLs below.</span>
          <span id="uploadStatus" role="status" aria-live="polite" class="text-sm"></span>
        </label>
        <label class="flex flex-col gap-1 md:col-span-2">
          <span class="text-sm font-medium">Additional image URLs (one per line, up to 12)</span>
          <textarea id="image_urls" rows="4" class="rounded-lg border border-slate-300 px-3 py-2"></textarea>
        </label>
        <label class="flex flex-col gap-1 md:col-span-2">
          <span class="text-sm font-medium">Video URL (optional, direct HTTPS MP4 or WebM file)</span>
          <input id="video_url" type="url" class="rounded-lg border border-slate-300 px-3 py-2" />
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-sm font-medium">Stock</span>
          <input id="stock" type="number" step="1" min="0" value="0" class="rounded-lg border border-slate-300 px-3 py-2" />
        </label>
        <div class="md:col-span-2">
          <button class="rounded-lg bg-emerald-600 px-4 py-2 font-medium text-white hover:bg-emerald-500" type="submit">Save Product</button>
        </div>
      </form>
      <p id="message" class="mt-4 text-sm"></p>
    </section>

    <section class="rounded-xl bg-white p-5 shadow-sm">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-xl font-semibold">Manage Products</h2>
        <button id="refreshBtn" class="rounded-lg bg-slate-900 px-4 py-2 text-white hover:bg-slate-700" type="button">Refresh</button>
      </div>
      <div id="productsGrid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    </section>
    <section class="mt-8 rounded-xl bg-white p-5 shadow-sm">
      <h2 class="text-xl font-semibold">Customer access requests</h2>
      <button id="refreshAccess" type="button" class="my-3 rounded-lg bg-slate-900 px-3 py-2 text-white">Refresh requests</button>
      <p id="accessRequestStatus" role="status"></p>
      <div id="accessRequests"></div>
      <button id="accessPrevious" type="button" class="mr-4" disabled>Previous</button>
      <button id="accessNext" type="button">Next</button>
    </section>
    <section class="mt-8 rounded-xl bg-white p-5"><h2 class="text-xl">Orders</h2><p class="my-3">Status changes do not restore stock. Adjust variant stock manually for cancellations.</p><button id="refreshOrders" class="border rounded px-4 py-2">Refresh orders</button><p id="ordersStatus" role="status"></p><div id="adminOrders"></div><button id="ordersPrevious">Previous</button> <button id="ordersNext">Next</button></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./catalog-editor.js"></script>
  <script src="./admin.js?v=phone-access-1"></script>
  <script src="./access-admin.js"></script>
  <script src="./product-upload.js"></script>
  <script src="./orders-admin.js"></script>
</body>
</html>
