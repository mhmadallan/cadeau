<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadeau Admin</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <nav class="border-b border-slate-200 bg-white/90 backdrop-blur-sm">
    <div class="mx-auto flex max-w-6xl flex-col gap-4 px-4 py-4 md:flex-row md:items-center md:justify-between">
      <div>
        <a href="./index.html" class="text-xl font-bold tracking-tight text-slate-950">Cadeau</a>
        <p class="text-sm text-slate-500">Store management for admins.</p>
      </div>
      <div class="flex flex-wrap items-center gap-2 md:justify-end">
        <span id="navUser" class="mr-2 text-sm text-slate-500">Guest</span>
        <a href="./index.html" class="rounded-full bg-white px-4 py-2 text-sm font-medium text-slate-900 ring-1 ring-slate-300 hover:bg-slate-50">Store</a>
        <a id="adminLink" href="./admin.html" aria-current="page" class="rounded-full bg-slate-900 px-4 py-2 text-sm font-medium text-white" hidden>Admin</a>
        <a id="signinLink" href="./signin.html" class="rounded-full bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-500">Login</a>
        <a id="signupLink" href="./signup.html" class="rounded-full bg-white px-4 py-2 text-sm font-medium text-slate-900 ring-1 ring-slate-300 hover:bg-slate-50">Sign Up</a>
        <button id="logoutBtn" class="rounded-full bg-slate-200 px-4 py-2 text-sm font-medium text-slate-800 hover:bg-slate-300" type="button" hidden>Logout</button>
      </div>
    </div>
  </nav>

  <main class="mx-auto max-w-6xl px-4 py-8">
    <header class="mb-8 flex flex-col gap-2 md:flex-row md:items-end md:justify-between">
      <div>
        <h1 class="text-3xl font-bold">Admin Panel</h1>
        <p class="text-slate-600">Add, edit, and delete products.</p>
      </div>
      <div class="flex gap-2">
        <a href="./index.html" class="rounded-lg bg-white px-4 py-2 text-slate-900 ring-1 ring-slate-300 hover:bg-slate-50">Back to Store</a>
      </div>
    </header>

    <section class="mb-8 rounded-xl bg-white p-5 shadow-sm">
      <h2 class="mb-2 text-xl font-semibold">Access Status</h2>
      <p id="authMessage" class="text-sm text-slate-600">Checking your account...</p>
    </section>

    <section id="manageSection" class="mb-8 rounded-xl bg-white p-5 shadow-sm" hidden>
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-xl font-semibold">Add Product</h2>
      </div>
      <form id="productForm" class="grid gap-4 md:grid-cols-2">
        <label class="flex flex-col gap-1">
          <span class="text-sm font-medium">Name *</span>
          <input id="name" class="rounded-lg border border-slate-300 px-3 py-2" required />
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-sm font-medium">Price *</span>
          <input id="price" type="number" step="0.01" min="0" class="rounded-lg border border-slate-300 px-3 py-2" required />
        </label>
        <label class="flex flex-col gap-1 md:col-span-2">
          <span class="text-sm font-medium">Description</span>
          <textarea id="description" rows="3" class="rounded-lg border border-slate-300 px-3 py-2"></textarea>
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-sm font-medium">Image URL</span>
          <input id="image_url" type="url" class="rounded-lg border border-slate-300 px-3 py-2" />
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-sm font-medium">Stock</span>
          <input id="stock" type="number" step="1" min="0" value="0" class="rounded-lg border border-slate-300 px-3 py-2" />
        </label>
        <div class="md:col-span-2">
          <button class="rounded-lg bg-emerald-600 px-4 py-2 font-medium text-white hover:bg-emerald-500" type="submit">Save Product</button>
        </div>
      </form>
      <p id="message" class="mt-4 text-sm"></p>
    </section>

    <section class="rounded-xl bg-white p-5 shadow-sm">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-xl font-semibold">Manage Products</h2>
        <button id="refreshBtn" class="rounded-lg bg-slate-900 px-4 py-2 text-white hover:bg-slate-700" type="button">Refresh</button>
      </div>
      <div id="productsGrid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./auth.js"></script>
  <script src="./admin.js"></script>
</body>
</html>
