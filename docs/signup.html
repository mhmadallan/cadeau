<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account - Cadeau</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <nav class="border-b border-slate-200 bg-white/90 backdrop-blur-sm">
    <div class="mx-auto flex max-w-6xl flex-col gap-4 px-4 py-4 md:flex-row md:items-center md:justify-between">
      <div>
        <a href="./index.html" class="text-xl font-bold tracking-tight text-slate-950">Cadeau</a>
        <p class="text-sm text-slate-500">Create an account to start shopping.</p>
      </div>
      <div class="flex flex-wrap items-center gap-2 md:justify-end">
        <span id="navUser" class="mr-2 text-sm text-slate-500">Guest</span>
        <a href="./index.html" class="rounded-full bg-white px-4 py-2 text-sm font-medium text-slate-900 ring-1 ring-slate-300 hover:bg-slate-50">Store</a>
        <a id="adminLink" href="./admin.html" class="rounded-full bg-white px-4 py-2 text-sm font-medium text-slate-900 ring-1 ring-slate-300 hover:bg-slate-50" hidden>Admin</a>
        <a id="signinLink" href="./signin.html" class="rounded-full bg-white px-4 py-2 text-sm font-medium text-slate-900 ring-1 ring-slate-300 hover:bg-slate-50">Login</a>
        <a id="signupLink" href="./signup.html" aria-current="page" class="rounded-full bg-slate-900 px-4 py-2 text-sm font-medium text-white">Sign Up</a>
        <button id="logoutBtn" type="button" class="rounded-full bg-slate-200 px-4 py-2 text-sm font-medium text-slate-800 hover:bg-slate-300" hidden>Logout</button>
      </div>
    </div>
  </nav>

  <main class="mx-auto max-w-xl px-4 py-10">
    <header class="mb-8 flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold">Create Account</h1>
        <p class="text-slate-600">Sign up to continue to Cadeau.</p>
      </div>
      <a href="./index.html" class="rounded-lg bg-white px-4 py-2 text-slate-900 ring-1 ring-slate-300 hover:bg-slate-50">Back Home</a>
    </header>

    <section class="rounded-xl bg-white p-6 shadow-sm">
      <form id="signupForm" class="space-y-4">
        <label class="block">
          <span class="mb-1 block text-sm font-medium">Email</span>
          <input id="email" type="email" required class="w-full rounded-lg border border-slate-300 px-3 py-2" />
        </label>
        <label class="block">
          <span class="mb-1 block text-sm font-medium">Password</span>
          <input id="password" type="password" required class="w-full rounded-lg border border-slate-300 px-3 py-2" />
        </label>
        <button type="submit" class="w-full rounded-lg bg-slate-900 px-4 py-2 text-white hover:bg-slate-700">Create Account</button>
      </form>

      <p class="mt-4 text-sm text-slate-600">
        Already have an account?
        <a href="./signin.html" class="font-medium text-emerald-700 hover:text-emerald-600">Sign in</a>
      </p>

      <p id="message" class="mt-3 text-sm"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./auth.js"></script>
  <script src="./signup.js"></script>
</body>
</html>
